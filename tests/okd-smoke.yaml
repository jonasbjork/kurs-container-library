# OPTIONAL: template example for an available OKD cluster; not used by CI.
# Prefer scripts/okd.py; see docs/OKD.md for automated SCC/identity checks.
# Replace the entire digest placeholder with a published linux/amd64 candidate digest.
# Apply only inside a temporary namespace with a dedicated unprivileged ServiceAccount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kurs-flask-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kurs-flask-smoke
  template:
    metadata:
      labels:
        app: kurs-flask-smoke
    spec:
      serviceAccountName: kurs-smoke
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: quay.io/kurs/flask-lab@sha256:REPLACE_WITH_64_HEX_DIGEST
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            failureThreshold: 100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
